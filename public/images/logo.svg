<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circle Outline -->
  <circle cx="60" cy="60" r="54" fill="#FFFFFF" stroke="#252522" stroke-width="4.5" />
  
  <!-- Salt Shaker (Tilted Left) -->
  <g transform="translate(16, 14) rotate(-16 40 45)">
    <!-- Shaker Cap -->
    <path d="M26 12 C26 7, 44 7, 44 12 L46 19 L24 19 Z" fill="#E5E7EB" stroke="#252522" stroke-width="3" stroke-linejoin="round" />
    <!-- Cap holes -->
    <circle cx="31" cy="13" r="1.5" fill="#252522" />
    <circle cx="35" cy="11.5" r="1.5" fill="#252522" />
    <circle cx="39" cy="13" r="1.5" fill="#252522" />
    <circle cx="33" cy="16" r="1.5" fill="#252522" />
    <circle cx="37" cy="16" r="1.5" fill="#252522" />

    <!-- Shaker Glass Body -->
    <path d="M23 20 L47 20 L51 68 C51 72, 47 75, 42 75 L28 75 C23 75, 19 72, 19 68 Z" fill="#FFFFFF" stroke="#252522" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Salt Levels & Shaker Texture lines -->
    <line x1="28" y1="23" x2="27" y2="72" stroke="#9CA3AF" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <line x1="35" y1="23" x2="35" y2="73" stroke="#D1D5DB" stroke-width="2.5" opacity="0.9" stroke-linecap="round" />
    <line x1="42" y1="23" x2="43" y2="72" stroke="#9CA3AF" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    
    <!-- Granules of Salt inside -->
    <circle cx="28" cy="48" r="1" fill="#6B7280" opacity="0.6" />
    <circle cx="33" cy="54" r="1.2" fill="#6B7280" opacity="0.7" />
    <circle cx="38" cy="50" r="1" fill="#6B7280" opacity="0.6" />
    <circle cx="31" cy="62" r="1.2" fill="#6B7280" opacity="0.7" />
    <circle cx="36" cy="66" r="1" fill="#6B7280" opacity="0.6" />
    <circle cx="42" cy="63" r="1" fill="#6B7280" opacity="0.5" />
  </g>

  <!-- Red Hot Chilli Pepper (In Front, Curling Right) -->
  <g transform="translate(10, 8)">
    <!-- Hot Smoky / Aroma Wavy Steam Lines above Chilli -->
    <path d="M84 42 C82 36, 86 32, 85 26" fill="none" stroke="#252522" stroke-width="2.8" stroke-linecap="round" />
    <path d="M89 44 C88 38, 93 34, 91 29" fill="none" stroke="#252522" stroke-width="2.8" stroke-linecap="round" />

    <!-- Chilli Black Stem -->
    <path d="M74 44 C76 39, 81 37, 83 40" fill="none" stroke="#252522" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Chilli Pepper Body -->
    <path d="M74 44 C68 45, 54 48, 44 58 C34 68, 38 78, 48 83 C60 88, 76 83, 85 68 C88 62, 88 54, 82 48 C79 45, 76 44, 74 44 Z" 
          fill="#D32F2F" 
          stroke="#252522" 
          stroke-width="3.5" 
          stroke-linejoin="round" />
    
    <!-- Chilli Highlight & Shadow Tone -->
    <path d="M48 60 C56 52, 68 49, 74 49 C76 52, 77 56, 75 60 C68 70, 56 75, 46 72" 
          fill="#EF5350" opacity="0.75" />
    <path d="M48 76 C56 80, 68 78, 76 70" 
          fill="none" stroke="#B71C1C" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
